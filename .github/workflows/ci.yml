name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and coverage
        run: mvn -B verify
      - name: Run example session
        run: java -jar target/order-matching-engine-1.0.0.jar examples/session.txt
      - name: Quick benchmark
        run: java -cp target/classes io.github.jamiecrock.matching.bench.Benchmark 500000
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
